         아이폰은 "홈 화면에 추가"할 때나 앱을 실행할 때 이 태그들을 처음부터(JS 실행 전에) 읽어야
         로딩 중에도 아이콘이 바로 보임 - 그래서 index.html에 처음부터 넣어둠 (App.jsx의 JS 추가 코드는
         혹시 몰라 그대로 둬도 안전함: 이미 있으면 중복으로 안 넣게 되어있음) -->
